name: Planning case

on:
  push:
    paths:
      - agents/02-planning/**
      - .github/workflows/planning.yml
  pull_request:
    paths:
      - agents/02-planning/**
      - .github/workflows/planning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-and-mocked-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agents/02-planning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: agents/02-planning/uv.lock
      - name: Install locked case dependencies
        run: uv sync --locked
      - name: Check fixture and mocked-provider behavior
        run: uv run --locked pytest -q
