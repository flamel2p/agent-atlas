[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "document-intelligence-demo"
version = "0.1.0"
description = "Bounded invoice extraction with field evidence and review decisions"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
ocr = ["Pillow>=13,<14"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.scripts]
document-intelligence = "document_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/document_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mocked_ocr: fake or mocked OCR process behavior, not image recognition"]
