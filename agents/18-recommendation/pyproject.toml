[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-atlas-recommendation"
version = "0.1.0"
description = "A bounded, inspectable recommendation demo over synthetic exercises"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
recommendation = "recommendation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recommendation"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/.python-version", "/LICENSE", "/*.md"]
