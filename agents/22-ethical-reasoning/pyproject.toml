[project]
name = "agent-atlas-ethical-reasoning"
version = "0.1.0"
description = "Synthetic host-enforced ethical policy checkpoint learning demo"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
ethical-reasoning = "ethical_reasoning.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethical_reasoning"]
