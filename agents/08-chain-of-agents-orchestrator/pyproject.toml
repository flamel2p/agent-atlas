[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "chain-of-agents-orchestrator"
version = "0.1.0"
description = "Fixture-only typed specialist orchestration learning demo"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
chain-orchestrator = "chain_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chain_orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

