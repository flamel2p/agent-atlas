[project]
name = "agent-atlas-tool-using"
version = "0.1.0"
description = "A bounded tool-using agent over synthetic campaign data"
requires-python = ">=3.14,<3.15"
dependencies = ["openai==3.31.0", "pydantic==2.14.1", "matplotlib==3.11.2"]

[project.scripts]
tool-using = "tool_using.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tool_using"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
