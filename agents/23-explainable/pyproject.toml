[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent23-explainable"
version = "0.1.0"
description = "Synthetic task priority explanations from one immutable execution trace"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
explainable = "explainable.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explainable"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "fixtures", "*.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version", ".gitignore"]
