[project]
name = "agent-atlas-memory-augmented"
version = "0.1.0"
description = "A bounded study assistant with explicit scoped episodic memory"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
live = ["openai==3.31.0", "httpx2==2.13.1"]

[project.scripts]
memory-agent = "memory_agent.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
