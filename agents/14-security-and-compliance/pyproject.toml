[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent-atlas-compliance-agent"
version = "1.0.0"
description = "A deterministic learning demo for synthetic sensitive-logging policy compliance"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
compliance-agent = "compliance_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_agent"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "pyproject.toml", "uv.lock", "README.md", "SPEC.md", "AGENTS.md", "PLAN.md", "LICENSE"]
