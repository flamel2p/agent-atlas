[project]
name = "atlas-healthcare-intelligence"
version = "0.1.0"
description = "Bounded fictional evidence and simulated review learning demo"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
healthcare-intelligence = "healthcare_intelligence.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_intelligence"]
