[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "agent20-audio-processing"
version = "0.1.0"
description = "Bounded PCM measurements and explicitly simulated fixture transcripts"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
audio-processing = "audio_processing.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audio_processing"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/README.md", "/SPEC.md", "/AGENTS.md", "/PLAN.md", "/VERIFICATION.md", "/pyproject.toml", "/uv.lock", "/.python-version"]
