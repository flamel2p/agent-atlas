[project]
name = "agent-atlas-planning"
version = "0.1.0"
description = "A bounded planning agent over a synthetic release task graph"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
live = ["openai==3.31.0"]

[project.scripts]
planning-agent = "planning_agent.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planning_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
