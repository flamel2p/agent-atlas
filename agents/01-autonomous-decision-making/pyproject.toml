[project]
name = "autonomous-decision-making"
version = "0.1.0"
description = "Bounded synthetic support triage with host-enforced authority"
requires-python = "==3.14.8"
dependencies = ["pydantic==2.14.1"]

[project.optional-dependencies]
live = ["openai==3.31.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
autonomous-decision-making = "autonomous_decision_making.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_decision_making"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
