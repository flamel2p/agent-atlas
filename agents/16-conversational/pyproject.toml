[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "atlas-conversational"
version = "0.1.0"
description = "A bounded, deterministic synthetic course dialogue with local memory"
requires-python = ">=3.14,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.scripts]
conversational = "conversational.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/conversational"]
