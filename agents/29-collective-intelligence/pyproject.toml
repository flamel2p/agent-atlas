[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "atlas-collective-intelligence"
version = "0.1.0"
description = "Bounded deterministic rubric cross-review learning demo"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
collective-intelligence = "collective_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/collective_intelligence"]
