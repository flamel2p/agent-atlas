[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "Bounded, reproducible analysis of observed product activity"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = []

[project.scripts]
data-analysis = "data_analysis_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analysis_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "SPEC.md", "AGENTS.md", "PLAN.md", "pyproject.toml", "uv.lock", ".python-version"]
