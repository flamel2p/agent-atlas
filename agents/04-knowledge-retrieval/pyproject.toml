[project]
name = "atlas-knowledge-agent"
version = "0.1.0"
description = "Bounded extractive retrieval over a synthetic support corpus"
requires-python = ">=3.14,<3.15"
dependencies = []

[project.optional-dependencies]
live = ["openai==3.31.0"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
knowledge-agent = "knowledge_agent.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
